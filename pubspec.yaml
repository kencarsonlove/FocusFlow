name: focusflow
description: A modern productivity and focus app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  flutter_animate: ^4.5.2
  fl_chart: ^1.0.0
  percent_indicator: ^4.2.5
  iconsax: ^0.0.8
  flutter_svg: ^2.2.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  cloud_firestore: ^5.6.12
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
